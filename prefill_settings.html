<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预输入规则设置 (云同步版)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; }
        h1, h2 { color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
        .container { background-color: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; align-items: center; }
        .form-group label { font-weight: bold; width: 150px; }
        .form-group input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        textarea { width: 100%; min-height: 150px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        #rulesList table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        #rulesList th, #rulesList td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        #rulesList .delete-btn { background-color: #f44336; padding: 5px 10px; font-size: 14px; }
        #rulesList .delete-btn:hover { background-color: #da190b; }
        .import-options { margin: 10px 0; }
        .loader { text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <h1>预输入规则设置 (云同步版)</h1>

    <div class="container">
        <h2>从 Excel 批量导入</h2>
        <p>请从电子表格中复制三列（姓名, 媒体机构, 国家/地区），然后粘贴到下面的文本框中。</p>
        <textarea id="bulkData" placeholder="例如:
liu	CGTN	China
wang	Xinhua	China
chen	CCTV	USA"></textarea>
        <div class="import-options">
            <input type="radio" id="replace" name="importMode" value="replace" checked>
            <label for="replace">替换所有现有规则</label>
            <input type="radio" id="append" name="importMode" value="append" style="margin-left: 20px;">
            <label for="append">添加到现有规则之后</label>
        </div>
        <button id="importBtn" onclick="importRules()">导入规则</button>
    </div>
    <div class="container">
        <h2>手动添加单条规则</h2>
        <div class="form-group">
            <label for="triggerName">姓名 (触发词):</label>
            <input type="text" id="triggerName" placeholder="例如: liu">
        </div>
        <div class="form-group">
            <label for="mediaOrg">自动填充媒体机构:</label>
            <input type="text" id="mediaOrg" placeholder="例如: CGTN">
        </div>
        <div class="form-group">
            <label for="countryRegion">自动填充国家/地区:</label>
            <input type="text" id="countryRegion" placeholder="例如: China">
        </div>
        <button id="saveBtn" onclick="saveRule()">保存单条规则</button>
    </div>

    <h2>当前规则列表</h2>
    <div id="rulesList"><div class="loader">正在从云端加载规则...</div></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVo5uAsDT9rGsKmMIetlJcBjYR1HnMIZcwBCsxH9Y2UO4-F82EhfdRMB9FipbrT0mT/exec";

        function setLoading(isLoading) {
            document.getElementById('importBtn').disabled = isLoading;
            document.getElementById('saveBtn').disabled = isLoading;
            const deleteButtons = document.querySelectorAll('.delete-btn');
            deleteButtons.forEach(btn => btn.disabled = isLoading);
        }

        // 批量导入规则
        function importRules() {
            const bulkText = document.getElementById('bulkData').value.trim();
            if (!bulkText) {
                alert('请粘贴要导入的数据。');
                return;
            }

            const lines = bulkText.split('\n');
            const newRules = lines.map(line => {
                const columns = line.split('\t');
                if (columns.length === 3) {
                    const [triggerName, media, country] = columns.map(item => item.trim());
                    if (triggerName && media && country) {
                        return { triggerName, media, country };
                    }
                }
                return null;
            }).filter(Boolean);

            if (newRules.length === 0) {
                alert('未能解析任何有效规则。请确保格式正确（三列，以Tab分隔）。');
                return;
            }

            const importMode = document.querySelector('input[name="importMode"]:checked').value;
            
            setLoading(true);
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'importRules', mode: importMode, data: newRules })
            })
            .then(() => {
                alert(`成功提交 ${newRules.length} 条规则进行处理！`);
                document.getElementById('bulkData').value = '';
                setTimeout(loadRules, 1000); // Give server a moment to process
            })
            .catch(error => {
                console.error('Error:', error);
                alert("导入失败，请稍后重试。");
            })
            .finally(() => {
                setLoading(false);
            });
        }

        // 保存单条规则
        function saveRule() {
            const triggerName = document.getElementById('triggerName').value.trim();
            const media = document.getElementById('mediaOrg').value.trim();
            const country = document.getElementById('countryRegion').value.trim();

            if (!triggerName || !media || !country) {
                alert('所有字段均为必填项。');
                return;
            }

            const ruleData = { triggerName, media, country };
            
            setLoading(true);
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'saveRule', data: ruleData })
            })
            .then(() => {
                 document.getElementById('triggerName').value = '';
                document.getElementById('mediaOrg').value = '';
                document.getElementById('countryRegion').value = '';
                setTimeout(loadRules, 1000); // Give server a moment to process
            })
            .catch(error => {
                console.error('Error:', error);
                alert("保存失败，请稍后重试。");
            })
            .finally(() => {
                setLoading(false);
            });
        }

        // 删除规则
        function deleteRule(triggerNameToDelete) {
            if (confirm(`确定要删除 "${triggerNameToDelete}" 这条规则吗？`)) {
                setLoading(true);
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'deleteRule', triggerName: triggerNameToDelete })
                })
                .then(() => {
                    setTimeout(loadRules, 1000); // Give server a moment to process
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("删除失败，请稍后重试。");
                })
                .finally(() => {
                    setLoading(false);
                });
            }
        }

        // 加载并显示规则
        function loadRules() {
            const rulesListDiv = document.getElementById('rulesList');
            rulesListDiv.innerHTML = '<div class="loader">正在从云端加载规则...</div>';
            
            fetch(SCRIPT_URL + '?action=getRules')
                .then(response => response.json())
                .then(rules => {
                    if (!rules || rules.length === 0) {
                        rulesListDiv.innerHTML = '<p>云端尚未设置任何规则。</p>';
                        return;
                    }

                    let tableHTML = `
                        <table>
                            <tr>
                                <th>姓名 (触发词)</th>
                                <th>媒体机构</th>
                                <th>国家/地区</th>
                                <th>操作</th>
                            </tr>`;
                    
                    rules.forEach(rule => {
                        tableHTML += `
                            <tr>
                                <td>${rule.triggerName}</td>
                                <td>${rule.media}</td>
                                <td>${rule.country}</td>
                                <td><button class="delete-btn" onclick="deleteRule('${rule.triggerName}')">删除</button></td>
                            </tr>`;
                    });

                    tableHTML += '</table>';
                    rulesListDiv.innerHTML = tableHTML;
                })
                .catch(error => {
                    console.error("加载规则失败:", error);
                    rulesListDiv.innerHTML = "<p>加载规则失败，请检查脚本URL或网络连接，并确保已正确部署最新脚本。</p>";
                });
        }
        
        // 页面加载时显示已有规则
        window.onload = loadRules;
    </script>
</body>
</html>
